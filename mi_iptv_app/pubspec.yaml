name: mi_iptv_app
description: "Una aplicación de streaming moderna para AmeycarTV."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.5
  video_player: ^2.9.2
  chewie: ^1.8.5
  http: ^1.2.0
  shared_preferences: ^2.3.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  # --- NUEVAS LIBRERÍAS AGREGADAS ---
  wakelock_plus: ^1.1.4
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
