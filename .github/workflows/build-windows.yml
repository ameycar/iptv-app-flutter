name: Compilar Windows EXE

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get
        working-directory: ./mi_iptv_app  # <--- CAMBIA ESTO si tu carpeta se llama distinto

      - name: Compilar aplicación para Windows (Release)
        run: flutter build windows --release
        working-directory: ./mi_iptv_app  # <--- CAMBIA ESTO si tu carpeta se llama distinto

      - name: Subir artefacto EXE
        uses: actions/upload-artifact@v4
        with:
          name: AmeycarTV-Windows-EXE
          path: mi_iptv_app/build/windows/x64/runner/Release/