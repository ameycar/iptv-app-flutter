name: Build APK IPTV

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          cd mi_iptv_app
          flutter pub get

      - name: Build APK
        run: |
          cd mi_iptv_app
          flutter build apk --release --obfuscate --split-debug-info=./debug_info --no-tree-shake-icons

      - name: Rename APK for Artifact Download
        run: |
          cd mi_iptv_app
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/AMEYCARTV.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AMEYCARTV-APK
          path: mi_iptv_app/build/app/outputs/flutter-apk/AMEYCARTV.apk